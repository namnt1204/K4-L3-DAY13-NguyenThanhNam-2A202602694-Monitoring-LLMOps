service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  error_budget_requests:
    per_1k_requests: 5
    per_10k_requests: 50
    per_100k_requests: 500
  rationale: |
    Baseline latency P95 đo được xấp xỉ 400ms - 1100ms trong điều kiện bình thường không có incident,
    tỷ lệ lỗi (error rate) là 0%. Ngưỡng SLO 3000ms (3.0s) tạo khoảng đệm an toàn (safety buffer)
    khoảng 3x so với P95 bình thường nhằm hấp thụ độ trễ biến thiên tự nhiên của mạng và LLM generation
    mà vẫn đảm bảo trải nghiệm người dùng liền mạch. Error budget 0.5% (tương đương tối đa 50 request
    không đạt tiêu chuẩn trên mỗi 10,000 requests) đủ chặt chẽ để kích hoạt cảnh báo sớm khi có sự cố.
guardrails:
  error_rate_pct_max: 2.0
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90.0
