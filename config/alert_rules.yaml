alerts:
  - name: HighLatencyP95
    severity: warning
    condition: "p95_latency_ms > 3000"
    duration: "5m"
    type: symptom-based
    channel: "#k4-l3b-alerts"
    owner: "student-2A202602694"
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: "error_rate_pct > 2.0"
    duration: "5m"
    type: symptom-based
    channel: "#k4-l3b-alerts"
    owner: "student-2A202602694"
    runbook: docs/alerts.md#alert-2
  - name: RetrievalDegradation
    severity: warning
    condition: "retrieval_success_rate_pct < 90.0"
    duration: "5m"
    type: symptom-based
    channel: "#k4-l3b-alerts"
    owner: "student-2A202602694"
    runbook: docs/alerts.md#alert-3
